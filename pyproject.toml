[project]
name = "raterbench"
version = "0.1.0"
description = "How reliable are LLMs as expert text raters? An open, reproducible benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SisnuSK" }]
# Runtime deps are added phase by phase; exact versions are pinned in uv.lock.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "krippendorff>=0.8",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Supervised encoder baseline (GPU). Install with: uv sync --extra train
train = [
    "torch>=2.9",
    "transformers>=4.50",
]

[project.scripts]
raterbench = "raterbench.cli:app"

# CUDA 13.0 PyTorch builds (needed for RTX 50-series / compute capability 12.0).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raterbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: typer's Option(...) defaults are the idiomatic pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
